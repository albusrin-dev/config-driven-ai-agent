# System config: dev environment.
# api_key_env is the NAME of the env var holding the key — never the value.
env: dev

providers:
  anthropic:
    api_key_env: ANTHROPIC_API_KEY
    # Used by the cost budget. USD per million tokens; adjust to the
    # model actually configured.
    pricing:
      input_usd_per_mtok: 3.0
      output_usd_per_mtok: 15.0
  local:
    endpoint: http://localhost:11434
    # keyless local provider: no api_key_env; no pricing -> cost cap inactive

limits:
  max_autonomy: supervised
  max_tokens_per_session: 100000
  max_cost_per_session_usd: 5.0
  max_tool_calls_per_session: 50

sandbox:
  # A relative fs_root is anchored to THIS file's directory (stable base,
  # never the CWD) — ../../workspace is <repo root>/workspace. Still a
  # confined sandbox: everything outside it is denied by the gate.
  fs_root: ../../workspace
  denied_paths: []
  command_deny_patterns: []
  egress_allowlist: []   # empty = deny-all once enforcement lands
