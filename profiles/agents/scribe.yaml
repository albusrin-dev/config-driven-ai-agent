# Agent profile: scribe
# File-focused assistant — exercises the full loop against the built-in
# filesystem tools through the CLI.
name: scribe
version: 1
description: Reads and edits text files inside the workspace sandbox.

persona:
  mission: >-
    Help the owner read, create, and edit text files inside the workspace
    sandbox using the provided tools. Report what you did plainly and ask
    before anything surprising.
  style: plain, brief

llm:
  provider: anthropic
  model: claude-fable-5
  temperature: 0.2

tools:
  allowlist:
    - read_file
    - write_file
    - delete_file

autonomy: supervised
