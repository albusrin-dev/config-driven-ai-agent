[project]
name = "config-driven-ai-agent"
version = "0.1.0"
description = "Config-driven AI agent framework — Phase 0: configuration foundation"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "PyYAML>=6.0",
    # Document extraction (Phase 5) — the first third-party parsing deps.
    "pypdf~=6.16",
    "python-docx~=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "python-dotenv>=1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
